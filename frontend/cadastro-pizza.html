<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastrar Pizza - Bella Napoli</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="fa-solid fa-pizza-slice text-warning me-2"></i>
          Bella Napoli
        </a>

        <a href="index.html" class="btn btn-outline-warning">
          <i class="fa-solid fa-arrow-left me-1"></i>
          Voltar ao Cardápio
        </a>
      </div>
    </nav>

    <!-- Cabeçalho -->
    <header class="cadastro-header text-center">
      <div class="container">
        <h1 class="fw-bold">
          <i class="fa-solid fa-pizza-slice text-warning me-2"></i>
          Cadastrar Pizza
        </h1>

        <p class="mb-0">Adicione uma nova pizza ao cardápio da Bella Napoli.</p>
      </div>
    </header>

    <!-- Formulário -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="card shadow border-0 cadastro-card">
            <div class="card-body p-4 p-md-5">
              <h4 class="fw-bold mb-4">Dados da Pizza</h4>

              <form id="pizza-form">
                <!-- Nome -->
                <div class="mb-3">
                  <label for="nome" class="form-label fw-semibold">
                    Nome da Pizza
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="nome"
                    placeholder="Ex.: Pizza Portuguesa"
                    required
                  />
                </div>

                <!-- Descrição -->
                <div class="mb-3">
                  <label for="descricao" class="form-label fw-semibold">
                    Descrição
                  </label>

                  <textarea
                    class="form-control"
                    id="descricao"
                    rows="3"
                    placeholder="Ex.: Molho de tomate, muçarela, presunto, ovo..."
                  ></textarea>
                </div>

                <div class="row">
                  <!-- Preço -->
                  <div class="col-md-6 mb-3">
                    <label for="preco" class="form-label fw-semibold">
                      Preço
                    </label>

                    <div class="input-group">
                      <span class="input-group-text">R$</span>

                      <input
                        type="number"
                        class="form-control"
                        id="preco"
                        placeholder="49.90"
                        min="0"
                        step="0.01"
                        required
                      />
                    </div>
                  </div>

                  <!-- Categoria -->
                  <div class="col-md-6 mb-3">
                    <label for="categoria" class="form-label fw-semibold">
                      Categoria
                    </label>

                    <select class="form-select" id="categoria" required>
                      <option value="">Selecione</option>

                      <option value="Tradicional">Tradicional</option>

                      <option value="Especial">Especial</option>

                      <option value="Premium">Premium</option>
                    </select>
                  </div>
                </div>

                <!-- Disponibilidade -->
                <div class="form-check form-switch mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="disponivel"
                    checked
                  />

                  <label class="form-check-label fw-semibold" for="disponivel">
                    Pizza disponível no cardápio
                  </label>
                </div>

                <!-- Mensagem -->
                <div id="mensagem" class="alert d-none" role="alert"></div>

                <!-- Botão -->
                <button
                  type="submit"
                  class="btn btn-warning w-100 py-2 fw-bold"
                >
                  <i class="fa-solid fa-floppy-disk me-2"></i>

                  Cadastrar Pizza
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
      <p class="mb-0">&copy; 2026 Pizzaria Bella Napoli.</p>
    </footer>

    <script src="cadastro-pizza.js"></script>
  </body>
</html>
